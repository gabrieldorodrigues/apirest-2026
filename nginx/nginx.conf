# Load balancer da API de Avaliação Musical: distribui as requisições entre as réplicas do serviço "api"

# DNS interno do Docker; reconsulta a cada 5 s para acompanhar réplicas que sobem, caem ou trocam de IP
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api_musica {
    zone api_musica 64k;
    # "api" resolve para o IP de cada réplica; sem outro método configurado o Nginx usa round-robin
    server api:8080 resolve max_fails=1 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://api_musica;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # failover: se uma réplica não responde, tenta a próxima
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        add_header X-Balanceador nginx always;
    }

    # health check do próprio load balancer
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
