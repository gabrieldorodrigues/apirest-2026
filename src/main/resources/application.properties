spring.application.name=musica
# sem variável de ambiente usa o H2 local em ./data
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/musica}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
# obriga a montar os DTOs dentro da transação do service, sem lazy loading escondido no controller
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.jpa.show-sql=false
# Swagger UI em /swagger-ui.html e especificação em /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.default-produces-media-type=application/json
# as respostas de erro de cada endpoint ficam declaradas no controller, sem repetir todas as do ApiExceptionHandler
springdoc.override-with-generic-response=false
# origens que podem chamar a API pelo navegador (a Swagger UI publicada no GitHub Pages)
api.cors.origens=${API_CORS_ORIGENS:https://gabrieldorodrigues.github.io}

# cache dos álbuns (carta-desafio 5): em memória por padrão; no docker compose, Redis (CACHE_TYPE=redis)
spring.cache.type=${CACHE_TYPE:simple}
spring.cache.cache-names=album,albuns
spring.cache.redis.time-to-live=${CACHE_TTL:10m}
# estatísticas de hit e miss em /actuator/metrics/cache.gets
spring.cache.redis.enable-statistics=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# tempo curto: com o Redis fora do ar, a requisição cai logo para o banco
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s
# o Redis é só cache: se ele cair, a API continua atendendo, então ele não entra no /actuator/health
management.health.redis.enabled=false

# Actuator: health check, informações da aplicação e métricas
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
# o .properties é lido em ISO-8859-1, por isso os acentos vão como \uXXXX
info.app.nome=API de Avalia\u00e7\u00e3o Musical
info.app.descricao=API REST para avaliar \u00e1lbuns e m\u00fasicas com nota e resenha
info.app.repositorio=https://github.com/gabrieldorodrigues/apirest-2026

# logs da aplicação no console e em arquivo (logs/musica.log, com rotação automática)
logging.level.com.example.musica=INFO
logging.file.name=logs/musica.log
