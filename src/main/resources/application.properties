spring.application.name=musica
# sem variável de ambiente usa o H2 local em ./data
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/musica}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
# obriga a montar os DTOs dentro da transação do service, sem lazy loading escondido no controller
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.jpa.show-sql=false
# Swagger UI em /swagger-ui.html e especificação em /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.default-produces-media-type=application/json
# as respostas de erro de cada endpoint ficam declaradas no controller, sem repetir todas as do ApiExceptionHandler
springdoc.override-with-generic-response=false
