spring.application.name=musica
# sem variável de ambiente usa o H2 local em ./data
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/musica}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
# obriga a montar os DTOs dentro da transação do service, sem lazy loading escondido no controller
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.jpa.show-sql=false
