# Gera a documentação com MkDocs, junto com a Swagger UI da API, e publica no GitHub Pages.
# Em pull requests só gera (--strict falha com link ou página quebrada); na main também publica.
name: Documentação

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "evidencias/**"
      - "mkdocs.yml"
      - "mkdocs-hooks/**"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      # a especificação da Swagger UI sai dos controllers e DTOs
      - "src/main/**"
      - "pom.xml"
  pull_request:
    paths:
      - "docs/**"
      - "evidencias/**"
      - "mkdocs.yml"
      - "mkdocs-hooks/**"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      # a especificação da Swagger UI sai dos controllers e DTOs
      - "src/main/**"
      - "pom.xml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Gerar site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # grava target/openapi.json; o hook mkdocs-hooks/swagger.py publica o arquivo em /swagger/
      - name: Gerar especificação OpenAPI
        run: ./mvnw -B test -Dtest=OpenApiDocsTest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Instalar MkDocs
        run: pip install -r requirements-docs.txt

      - name: Gerar site
        run: mkdocs build --strict

      - name: Enviar site para o Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publicar no GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
